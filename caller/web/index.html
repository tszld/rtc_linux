<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RTC 呼叫客户端</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">RTC 呼叫端</p>
        <h1>发起人工呼叫</h1>
      </div>
      <div id="connection" class="status-dot">正在读取配置</div>
    </header>

    <section class="panel call-panel">
      <div class="fields">
        <label>
          显示名称
          <input id="displayName" maxlength="64" autocomplete="off">
        </label>
        <label>
          客户端编号
          <input id="clientId" readonly>
        </label>
      </div>

      <div class="call-state">
        <span id="stateBadge" class="badge idle">未呼叫</span>
        <p id="statusText">点击开始呼叫后会发布本机麦克风音频。</p>
      </div>

      <div class="actions">
        <button id="startCall" class="primary">发起呼叫</button>
        <button id="mute" disabled>静音</button>
        <button id="shareScreen" disabled>共享屏幕</button>
        <button id="resumeAudio" hidden>播放客服声音</button>
        <button id="hangup" class="danger" disabled>挂断</button>
      </div>
    </section>

    <section class="panel session-panel">
      <div class="session-row">
        <span>会话</span>
        <strong id="sessionId">-</strong>
      </div>
      <div class="session-row">
        <span>状态</span>
        <strong id="sessionStatus">-</strong>
      </div>
      <div class="session-row">
        <span>远端音频</span>
        <strong id="remoteAudio">未连接</strong>
      </div>
      <div class="session-row">
        <span>屏幕共享</span>
        <strong id="screenShareState">未共享</strong>
      </div>
    </section>

    <p id="errorText" class="error" role="alert"></p>
  </main>
  <script src="/sdk.js"></script>
  <script src="/app.js"></script>
</body>
</html>
