<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RTC 通话</title>
  <link rel="stylesheet" href="/rtc.css">
</head>
<body>
  <main>
    <div class="header">
      <span class="signal" id="signal"></span>
      <strong id="state">RTC 未启动</strong>
    </div>
    <p id="message">接听后建立客服音频和屏幕画面。</p>
    <section class="screen-section">
      <div class="screen-meta">
        <strong>呼叫端屏幕</strong>
        <span id="screenState">未共享</span>
      </div>
      <div
        id="remoteScreen"
        class="screen-stage"
        data-empty="呼叫端尚未共享屏幕"
      ></div>
    </section>
    <div class="actions">
      <button id="play" hidden>播放远端声音</button>
    </div>
  </main>
  <script src="/qwebchannel.js"></script>
  <script src="/sdk.js"></script>
  <script src="/rtc.js"></script>
</body>
</html>
