<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>ARTC 管理控制台</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <section id="adminLoginView" class="login-view">
      <main class="login-panel" aria-labelledby="adminLoginTitle">
        <div class="brand-block">
          <span class="brand-mark" aria-hidden="true">AR</span>
          <div>
            <p class="eyebrow">ARTC</p>
            <h1 id="adminLoginTitle">管理控制台</h1>
          </div>
        </div>

        <form id="adminLoginForm" class="login-form">
          <label for="adminUsername">管理员账号</label>
          <input
            id="adminUsername"
            type="text"
            autocomplete="username"
            maxlength="64"
            required
            autofocus
          >

          <label for="adminPassword">密码</label>
          <input
            id="adminPassword"
            type="password"
            autocomplete="current-password"
            maxlength="256"
            required
          >

          <p id="adminLoginError" class="form-error" role="alert" hidden></p>
          <button id="adminLoginButton" class="button button-primary button-wide" type="submit" disabled>
            登录
          </button>
          <a class="text-link" href="/">返回客服登录</a>
        </form>

        <p class="login-footnote">阿里云 ARTC Web SDK</p>
      </main>
    </section>

    <div id="adminApp" class="admin-shell" hidden>
      <header class="app-header">
        <div class="brand-block compact">
          <span class="brand-mark" aria-hidden="true">AR</span>
          <div>
            <p class="eyebrow">ARTC</p>
            <h1>管理控制台</h1>
          </div>
        </div>
        <div class="header-meta">
          <span id="adminConnection" class="status-pill success">
            <span class="status-dot" aria-hidden="true"></span>
            <span>管理员在线</span>
          </span>
          <span id="adminName" class="agent-name"></span>
          <a class="button button-quiet" href="/">客服工作台</a>
          <button id="adminLogoutButton" class="button button-quiet" type="button">退出登录</button>
        </div>
      </header>

      <div class="admin-body">
        <aside class="admin-nav" aria-label="管理导航">
          <button class="admin-nav-item active" type="button" data-admin-view="robots">机器人审批</button>
          <button class="admin-nav-item" type="button" data-admin-view="agents">客服账号</button>
          <button class="admin-nav-item" type="button" data-admin-view="audit">审计记录</button>
        </aside>

        <main class="admin-main">
          <section id="robotsPanel" class="admin-panel">
            <header class="admin-panel-header">
              <div>
                <p class="eyebrow">设备目录</p>
                <h2>机器人审批</h2>
              </div>
              <button id="refreshAdminButton" class="button button-secondary button-small" type="button">
                刷新
              </button>
            </header>

            <form id="createRobotForm" class="admin-form">
              <div class="field-group">
                <label for="robotDisplayName">机器人名称</label>
                <input id="robotDisplayName" type="text" maxlength="128" required>
              </div>
              <button class="button button-primary" type="submit">创建机器人</button>
            </form>

            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>名称</th>
                    <th>机器人 ID</th>
                    <th>状态</th>
                    <th>审批</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="robotTableBody"></tbody>
              </table>
            </div>
          </section>

          <section id="agentsPanel" class="admin-panel" hidden>
            <header class="admin-panel-header">
              <div>
                <p class="eyebrow">账号与权限</p>
                <h2>客服账号</h2>
              </div>
            </header>

            <form id="createAgentForm" class="admin-form admin-form-wrap">
              <div class="field-group">
                <label for="agentUsername">用户名</label>
                <input id="agentUsername" type="text" maxlength="64" autocomplete="off" required>
              </div>
              <div class="field-group">
                <label for="agentDisplayName">显示名称</label>
                <input id="agentDisplayName" type="text" maxlength="128" required>
              </div>
              <div class="field-group">
                <label for="agentPassword">初始密码</label>
                <input id="agentPassword" type="password" minlength="8" maxlength="256" autocomplete="new-password" required>
              </div>
              <button class="button button-primary" type="submit">创建客服</button>
            </form>

            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>用户名</th>
                    <th>显示名称</th>
                    <th>角色</th>
                    <th>状态</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="agentTableBody"></tbody>
              </table>
            </div>
          </section>

          <section id="auditPanel" class="admin-panel" hidden>
            <header class="admin-panel-header">
              <div>
                <p class="eyebrow">安全记录</p>
                <h2>审计记录</h2>
              </div>
            </header>
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>时间</th>
                    <th>操作</th>
                    <th>对象类型</th>
                    <th>对象 ID</th>
                  </tr>
                </thead>
                <tbody id="auditTableBody"></tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <dialog id="secretDialog" class="secret-dialog">
      <form method="dialog">
        <p id="secretEyebrow" class="eyebrow"></p>
        <h2 id="secretTitle"></h2>
        <p id="secretMessage" class="muted-copy"></p>
        <dl class="secret-list">
          <dt id="secretLabelOne"></dt>
          <dd id="secretValueOne"></dd>
          <dt id="secretLabelTwo"></dt>
          <dd id="secretValueTwo"></dd>
        </dl>
        <div class="dialog-actions">
          <button id="copySecretButton" class="button button-secondary" type="button">复制</button>
          <button class="button button-primary" value="close">关闭</button>
        </div>
      </form>
    </dialog>

    <div id="adminToastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="/admin.js"></script>
  </body>
</html>
